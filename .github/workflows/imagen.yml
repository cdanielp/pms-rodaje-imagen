name: imagen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  IMAGEN: ghcr.io/cdanielp/pms-rodaje-h3
  ETIQUETA: 0.44.2-1
jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Liberar disco del runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - name: Construir
        run: docker build --build-arg PMS_ETIQUETA=$ETIQUETA -t $IMAGEN:$ETIQUETA -t $IMAGEN:latest .
      - name: Revisar que no haya modelos ni secretos
        run: |
          docker run --rm --entrypoint /bin/sh $IMAGEN:$ETIQUETA -c 'test -L /opt/pms/ComfyUI/models && ! find /opt/pms /root -size +500M | grep . && ! env | grep -iE "token|key|secret" && cat /opt/pms/IMAGEN_PMS.json'
          docker image ls $IMAGEN
      - name: Publicar en ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGEN:$ETIQUETA
          docker push $IMAGEN:latest
